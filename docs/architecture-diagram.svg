<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="stellarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  <rect width="900" height="480" rx="16" fill="url(#stellarGrad)" />
  <text x="450" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Stellar Payment Hub - System Architecture</text>
  <text x="450" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Protocol 22 Soroban Virtual Machine &amp; Full-Stack Orchestration</text>
  
  <!-- Client Tier -->
  <rect x="50" y="110" width="230" height="310" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <text x="165" y="140" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#38BDF8" text-anchor="middle">Client Layer</text>
  <rect x="70" y="165" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="165" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">React 18 / Vite Web App</text>
  <rect x="70" y="225" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="165" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Freighter Wallet Extension</text>
  <rect x="70" y="285" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="165" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">SEP-0007 QR Code Engine</text>
  <rect x="70" y="345" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="165" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Dev Keypair Sandbox</text>

  <!-- Backend Tier -->
  <rect x="335" y="110" width="230" height="310" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <text x="450" y="140" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#818CF8" text-anchor="middle">Backend Orchestration</text>
  <rect x="355" y="165" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="450" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Express / TypeScript API</text>
  <rect x="355" y="225" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="450" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">SSE Real-Time Push Stream</text>
  <rect x="355" y="285" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="450" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">BigInt Stroop Math Engine</text>
  <rect x="355" y="345" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="450" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">HMAC Webhook Dispatcher</text>

  <!-- Soroban Blockchain Tier -->
  <rect x="620" y="110" width="230" height="310" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <text x="735" y="140" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#34D399" text-anchor="middle">Soroban Smart Contracts</text>
  <rect x="640" y="165" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="735" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">settlement-router Contract</text>
  <rect x="640" y="225" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="735" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">payment-registry Contract</text>
  <rect x="640" y="285" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="735" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">SAC Tokens (USDC, EURC)</text>
  <rect x="640" y="345" width="190" height="45" rx="8" fill="#0F172A" stroke="#475569" />
  <text x="735" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Protocol 22 VM Core</text>

  <!-- Connectors -->
  <path d="M 280 265 L 335 265" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M 565 265 L 620 265" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6,4" />
</svg>
