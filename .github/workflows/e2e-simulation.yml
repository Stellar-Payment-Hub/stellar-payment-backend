name: E2E Integration Simulation

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 4:00 AM UTC
  workflow_dispatch:

jobs:
  simulate-stellar-e2e:
    name: Simulate Stellar Testnet Lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Backend Service in Background
        run: npm run dev &
        env:
          PORT: 3000
          NODE_ENV: test

      - name: Verify Health Endpoint
        run: |
          sleep 5
          curl -f http://localhost:3000/health || exit 1

      - name: Run E2E Test Suite
        run: npm test tests/e2e-lifecycle.test.ts
